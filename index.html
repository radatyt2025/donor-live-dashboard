<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подаруй життя — Live Dashboard</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#fff;background:#100c20}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 50%,#4d1635 0,#171027 54%,#080817 100%)}button,input,select{font:inherit}button{cursor:pointer;background:#fa3156;color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:700}button.secondary{background:#34263c}button:disabled{opacity:.5}header{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:20px 30px;border-bottom:1px solid #ffffff2b}header strong{font-size:20px}.live{color:#ff4260;text-shadow:0 0 14px #f35}.wrap{max-width:1600px;margin:auto;padding:22px}.title{text-align:center;font-size:clamp(28px,4vw,60px);color:#ffd4a0;font-style:italic;text-shadow:0 0 20px #fb5a32}.subtitle{text-align:center;letter-spacing:.35em;font-size:clamp(12px,1.7vw,22px);margin:0 0 24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.panel{background:linear-gradient(150deg,#342138e8,#1b1527e8);border:1px solid #f68eaa77;box-shadow:0 0 22px #f03b6133,inset 0 0 20px #ffffff09;border-radius:22px;padding:22px}.metric{text-align:center}.metric .num{font-size:clamp(32px,5vw,64px);font-weight:850}.metric small{color:#ffb9c9}.middle{display:grid;grid-template-columns:1fr .9fr 1fr;gap:18px;margin-top:20px}.center{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.drop{font-size:clamp(120px,18vw,260px);filter:drop-shadow(0 0 35px #f33);line-height:1.2}.goal{margin-top:20px}.progress{height:25px;background:#4b344a;border-radius:20px;overflow:hidden;margin-top:16px}.bar{height:100%;width:0;background:linear-gradient(90deg,#e92e43,#ffb13a);box-shadow:0 0 18px #f44;transition:width .6s}.rank{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #ffffff20}.rank:last-child{border:0}.blood{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.blood div{text-align:center;padding:15px 4px;background:linear-gradient(#513044,#9e203c);border-radius:14px}.blood b{display:block;font-size:28px}.admin{max-width:1000px;margin:auto}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{display:block;margin:8px 0;color:#ffe1e7}select,input{width:100%;padding:12px;border:1px solid #96647a;border-radius:10px;background:#211929;color:white}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#c7b7c8}.entry{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #ffffff22}.error{color:#ff9fae}a{color:#ffb9c9}@media(max-width:850px){.middle{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stats .panel:last-child{grid-column:span 2}.formgrid{grid-template-columns:1fr}.blood{grid-template-columns:repeat(4,1fr)}}@media(min-width:1100px){body.screen .wrap{max-width:1800px}} 
</style></head><body><header><strong>🩸 Подаруй життя <span class="live">● LIVE</span></strong><nav class="toolbar"><button class="secondary" onclick="setMode('screen')">Екран</button><button class="secondary" onclick="setMode('admin')">Адмінпанель</button></nav></header><main id="app"></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.97.0/dist/umd/supabase.min.js"></script><script>const URL='https://cygkwcenngjheqpmtlif.supabase.co',KEY='sb_publishable_H8TE3_Wr8G2v2N90Er2pLw_YnkdwGUk';
const schools=['IT STEP Університет','ЛНУ ім. Івана Франка','ЛДУБЖД','ЛДУВС','ЛДУФК ім. І. Боберського'],types=['O−','O+','A−','A+','B−','B+','AB−','AB+'];
const client=window.supabase.createClient(URL,KEY),app=document.getElementById('app');let mode=new URLSearchParams(location.search).get('mode')==='admin'?'admin':'screen',state={goal:75,donors:[]},user=null,isAdmin=false,error='',recovery=false,notice='';
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&#39;'}[c]))}
function setMode(v){mode=v;history.replaceState({},'',v==='admin'?'?mode=admin':'/');render()}
async function refresh(){const [d,g]=await Promise.all([client.from('donor_entries').select('id,school,blood,ml,created_at').order('created_at',{ascending:false}),client.from('dashboard_settings').select('goal').eq('id',1).single()]);if(d.error||g.error){error='Не вдалося завантажити дані';console.error(d.error,g.error)}else{state.donors=d.data;state.goal=g.data.goal;error=''}render()}
async function checkAdmin(){const {data}=await client.auth.getUser();user=data.user;if(user){const a=await client.from('dashboard_admins').select('user_id').eq('user_id',user.id).maybeSingle();isAdmin=!!a.data}else isAdmin=false;render()}
function counts(){return schools.map(s=>({name:s,count:state.donors.filter(d=>d.school===s).length})).sort((a,b)=>b.count-a.count)}
function render(){const n=state.donors.length,liters=(state.donors.reduce((s,d)=>s+Number(d.ml),0)/1000).toLocaleString('uk-UA',{maximumFractionDigits:2}),pct=Math.min(100,Math.round(n/state.goal*100));app.innerHTML=mode==='screen'?'<div class="wrap"><div class="title">Подаруй життя ❤️</div><div class="subtitle">ДОНОРСТВО ОБ’ЄДНУЄ</div><section class="stats"><div class="panel metric">Донорів<div class="num">'+n+'</div></div><div class="panel metric">Зібрано крові<div class="num">'+liters+' л</div></div><div class="panel metric">Потенційно врятованих життів<div class="num">до '+n*3+'</div><small>Орієнтовна оцінка</small></div></section><section class="middle"><div class="panel"><h2>🏆 Рейтинг університетів</h2>'+counts().map((s,i)=>'<div class="rank"><span>'+(i+1)+'. '+safe(s.name)+'</span><b>'+s.count+'</b></div>').join('')+'</div><div class="center"><div class="drop">🩸</div><h2>Спільна ціль — '+state.goal+' донорів</h2></div><div class="panel"><h2>🩸 Групи крові донорів</h2><div class="blood">'+types.map(t=>'<div>'+t+'<b>'+state.donors.filter(d=>d.blood===t).length+'</b></div>').join('')+'</div></div></section><section class="panel goal"><h2>Спільна ціль — '+n+' / '+state.goal+' донорів ('+pct+'%)</h2><div class="progress"><div class="bar" style="width:'+pct+'%"></div></div></section><p class="muted" style="text-align:center">4 грудня · Донорство об’єднує</p>'+(error?'<p class="error">'+error+'</p>':'')+'</div>':adminHTML();bind()}
function adminHTML(){if(recovery)return '<div class="wrap admin"><section class="panel"><h1>Встановити новий пароль</h1><form id="newPassword"><label>Новий пароль (мінімум 8 символів)</label><input type="password" name="password" minlength="8" autocomplete="new-password" required><p><button>Зберегти пароль</button></p></form><p class="error">'+safe(error)+'</p></section></div>';if(!user)return '<div class="wrap admin"><section class="panel"><h1>Вхід організатора</h1><p>Введіть email облікового запису Supabase, який має права адміністратора.</p><form id="login"><label>Email</label><input type="email" name="email" required><label>Пароль</label><input type="password" name="password" required><p><button>Увійти</button></p></form><p><button class="secondary" type="button" id="resetPassword">Надіслати лист для встановлення пароля</button></p><p class="muted">'+safe(notice)+'</p><p class="error">'+safe(error)+'</p></section></div>';if(!isAdmin)return '<div class="wrap admin panel"><h2>Немає прав адміністратора</h2><p>Ваш обліковий запис ще не додано до списку адміністраторів.</p><button id="logout">Вийти</button></div>';return '<div class="wrap admin"><h1>Керування донорами</h1><p class="muted">Дані зберігаються у Supabase і оновлюються на всіх пристроях.</p><section class="panel"><h2>Додати донора</h2><form id="donorForm"><div class="formgrid"><div><label>Університет</label><select name="school">'+schools.map(s=>'<option>'+safe(s)+'</option>').join('')+'</select></div><div><label>Група крові</label><select name="blood">'+types.map(t=>'<option>'+t+'</option>').join('')+'</select></div><div><label>Обсяг крові, мл</label><input name="ml" type="number" min="1" max="1000" value="350" required></div></div><p><button>+ Додати донора</button></p></form></section><section class="panel" style="margin-top:20px"><h2>Налаштування</h2><div class="toolbar"><label>Ціль <input id="goal" type="number" min="1" value="'+state.goal+'" style="width:120px"></label><button id="saveGoal">Зберегти ціль</button><button class="secondary" id="logout">Вийти</button></div></section><section class="panel" style="margin-top:20px"><h2>Записи ('+state.donors.length+')</h2>'+state.donors.map(d=>'<div class="entry"><span>'+safe(d.school)+' · '+safe(d.blood)+' · '+Number(d.ml)+' мл</span><button class="secondary" data-delete="'+safe(d.id)+'">Видалити</button></div>').join('')+'</section><p class="error">'+safe(error)+'</p></div>'}
function bind(){if(mode!=='admin')return;const newPassword=document.getElementById('newPassword');if(newPassword)newPassword.onsubmit=async e=>{e.preventDefault();const password=new FormData(newPassword).get('password');const r=await client.auth.updateUser({password});if(r.error){error=r.error.message;render()}else{recovery=false;error='';notice='Пароль успішно встановлено';await checkAdmin()}};const resetPassword=document.getElementById('resetPassword');if(resetPassword)resetPassword.onclick=async()=>{const email=document.querySelector('#login input[name=email]').value.trim();if(!email){error='Спочатку введіть email';render();return}const r=await client.auth.resetPasswordForEmail(email,{redirectTo:'https://donor-live-dashboard.vercel.app/?mode=admin'});error=r.error?.message||'';notice=r.error?'':'Якщо адреса зареєстрована, лист для відновлення пароля надіслано. Перевірте пошту.';render()};const login=document.getElementById('login');if(login)login.onsubmit=async e=>{e.preventDefault();const f=new FormData(login),r=await client.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(r.error){error=r.error.message;render()}else{error='';await checkAdmin()}};const logout=document.getElementById('logout');if(logout)logout.onclick=async()=>{await client.auth.signOut();await checkAdmin()};if(!isAdmin)return;document.getElementById('donorForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),r=await client.from('donor_entries').insert({school:f.get('school'),blood:f.get('blood'),ml:Number(f.get('ml'))});error=r.error?.message||'';await refresh()};document.getElementById('saveGoal').onclick=async()=>{const goal=Number(document.getElementById('goal').value);if(!Number.isInteger(goal)||goal<1)return;const r=await client.from('dashboard_settings').update({goal}).eq('id',1);error=r.error?.message||'';await refresh()};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Видалити запис?'))return;const r=await client.from('donor_entries').delete().eq('id',b.dataset.delete);error=r.error?.message||'';await refresh()})}
client.channel('dashboard-changes').on('postgres_changes',{event:'*',schema:'public',table:'donor_entries'},()=>refresh()).on('postgres_changes',{event:'*',schema:'public',table:'dashboard_settings'},()=>refresh()).subscribe();
client.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recovery=true;mode='admin';render()}else if(!recovery){setTimeout(checkAdmin,0)}});refresh();checkAdmin();</script></body></html>

async function refresh(){const [d,g]=await Promise.all([client.from('donor_entries').select('id,school,blood,ml,created_at').order('created_at',{ascending:false}),client.from('dashboard_settings').select('goal').eq('id',1).single()]);if(d.error||g.error){error='Не вдалося завантажити дані';console.error(d.error,g.error)}else{state.donors=d.data;state.goal=g.data.goal;error='';if(initialized&&(mode==='screen'||mode==='tv')&&previousCount<state.goal&&state.donors.length>=state.goal&&state.donors.length>previousCount)showMilestone(state.goal);previousCount=state.donors.length;previousGoal=state.goal;initialized=true}render()}

function queueDonorCelebration(school){if(mode!=='screen'&&mode!=='tv')return;eventQueue.push(school);if(!eventActive)showNextCelebration()}function showNextCelebration(){if(!eventQueue.length){eventActive=false;return}eventActive=true;const school=eventQueue.shift(),layer=document.getElementById('donorEvent');document.getElementById('eventSchool').textContent=school;layer.hidden=false;layer.querySelectorAll('.event-card,.event-ring,.event-wash').forEach(el=>{el.style.animation='none';void el.offsetWidth;el.style.animation=''});setTimeout(()=>{layer.hidden=true;showNextCelebration()},5300)}function showMilestone(goal){if(milestoneActive)return;milestoneActive=true;const layer=document.getElementById('milestoneEvent'),host=document.getElementById('confettiHost');document.getElementById('milestoneSubtitle').textContent=goal+' донорів — разом ми робимо більше!';host.replaceChildren();const colors=['#f8d17c','#fff5d9','#f66c82','#e8a84e','#ffffff'];for(let i=0;i<100;i++){const p=document.createElement('i');p.className='confetti';p.style.setProperty('--x',(i*67.91%100)+'%');p.style.setProperty('--w',(5+i%6)+'px');p.style.setProperty('--h',(9+i%9)+'px');p.style.setProperty('--c',colors[i%colors.length]);p.style.setProperty('--dur',(3.4+i%6*.6)+'s');p.style.setProperty('--delay',(-i%12*.43)+'s');p.style.setProperty('--drift',((i*37%220)-110)+'px');p.style.setProperty('--rot',(i*49)+'deg');host.appendChild(p)}layer.hidden=false;clearTimeout(milestoneTimer);milestoneTimer=setTimeout(()=>{layer.hidden=true;host.replaceChildren();milestoneActive=false},9000)}function animateNumbers(){if(mode!=='screen'&&mode!=='tv')return;document.querySelectorAll('[data-animate-value]').forEach(el=>{const end=Number(el.dataset.animateValue),decimals=Number(el.dataset.decimals||0),prefix=el.dataset.prefix||'',suffix=el.dataset.suffix||'',duration=850,start=performance.now();function tick(now){if(!el.isConnected)return;const p=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-p,3);el.textContent=prefix+(end*ease).toLocaleString('uk-UA',{minimumFractionDigits:decimals,maximumFractionDigits:decimals})+suffix;if(p<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)})}function counts(){return schools.map(s=>({name:s,count:state.donors.filter(d=>d.school===s).length})).sort((a,b)=>b.count-a.count)}
function render(){const n=state.donors.length,liters=(state.donors.reduce((s,d)=>s+Number(d.ml),0)/1000).toLocaleString('uk-UA',{maximumFractionDigits:2}),pct=Math.min(100,Math.round(n/state.goal*100));document.body.classList.toggle('tv',mode==='tv');document.body.classList.toggle('screen',mode==='screen'||mode==='tv');document.documentElement.classList.toggle('tv',mode==='tv');app.innerHTML=(mode==='screen'||mode==='tv')?'<div class="wrap"><div class="title">Подаруй життя ❤️</div><div class="subtitle">ДОНОРСТВО ОБ’ЄДНУЄ</div><section class="stats"><div class="panel metric">Донорів<div class="num" data-animate-value="'+n+'">'+n+'</div></div><div class="panel metric">Зібрано крові<div class="num" data-animate-value="'+(state.donors.reduce((s,d)=>s+Number(d.ml),0)/1000)+'" data-decimals="2" data-suffix=" л">'+liters+' л</div></div><div class="panel metric">Потенційно врятованих життів<div class="num" data-animate-value="'+n*3+'" data-prefix="до ">до '+n*3+'</div><small>Орієнтовна оцінка</small></div></section><section class="middle"><div class="panel"><h2>🏆 Рейтинг університетів</h2>'+counts().map((s,i)=>'<div class="rank"><span>'+(i+1)+'. '+safe(s.name)+'</span><b>'+s.count+'</b></div>').join('')+'</div><div class="center"><div class="drop">🩸</div><h2>Спільна ціль — '+state.goal+' донорів</h2></div><div class="panel"><h2>🩸 Групи крові донорів</h2><div class="blood">'+types.map(t=>'<div>'+t+'<b>'+state.donors.filter(d=>d.blood===t).length+'</b></div>').join('')+'</div></div></section><section class="panel goal"><h2>Спільна ціль — '+n+' / '+state.goal+' донорів ('+pct+'%)</h2><div class="progress"><div class="bar" style="width:'+pct+'%"></div></div></section><p class="muted" style="text-align:center">4 грудня · Донорство об’єднує</p>'+(error?'<p class="error">'+error+'</p>':'')+'</div>':adminHTML();bind();animateNumbers()}
function adminHTML(){if(recovery)return '<div class="wrap admin"><section class="panel"><h1>Встановити новий пароль</h1><form id="newPassword"><label>Новий пароль (мінімум 8 символів)</label><input type="password" name="password" minlength="8" autocomplete="new-password" required><p><button>Зберегти пароль</button></p></form><p class="error">'+safe(error)+'</p></section></div>';if(!user)return '<div class="wrap admin"><section class="panel"><h1>Вхід організатора</h1><p>Введіть email облікового запису Supabase, який має права адміністратора.</p><form id="login"><label>Email</label><input type="email" name="email" required><label>Пароль</label><input type="password" name="password" required><p><button>Увійти</button></p></form><p><button class="secondary" type="button" id="resetPassword">Надіслати лист для встановлення пароля</button></p><p class="muted">'+safe(notice)+'</p><p class="error">'+safe(error)+'</p></section></div>';if(!isAdmin)return '<div class="wrap admin panel"><h2>Немає прав адміністратора</h2><p>Ваш обліковий запис ще не додано до списку адміністраторів.</p><button id="logout">Вийти</button></div>';return '<div class="wrap admin"><h1>Керування донорами</h1><p class="muted">Дані зберігаються у Supabase і оновлюються на всіх пристроях.</p><section class="panel"><h2>Додати донора</h2><form id="donorForm"><div class="formgrid"><div><label>Університет</label><select name="school">'+schools.map(s=>'<option>'+safe(s)+'</option>').join('')+'</select></div><div><label>Група крові</label><select name="blood">'+types.map(t=>'<option>'+t+'</option>').join('')+'</select></div><div><label>Обсяг крові, мл</label><input name="ml" type="number" min="1" max="1000" value="350" required></div></div><p><button>+ Додати донора</button></p></form></section><section class="panel" style="margin-top:20px"><h2>Налаштування</h2><div class="toolbar"><label>Ціль <input id="goal" type="number" min="1" value="'+state.goal+'" style="width:120px"></label><button id="saveGoal">Зберегти ціль</button><button class="secondary" id="logout">Вийти</button></div></section><section class="panel" style="margin-top:20px"><h2>Записи ('+state.donors.length+')</h2>'+state.donors.map(d=>'<div class="entry"><span>'+safe(d.school)+' · '+safe(d.blood)+' · '+Number(d.ml)+' мл</span><button class="secondary" data-delete="'+safe(d.id)+'">Видалити</button></div>').join('')+'</section><p class="error">'+safe(error)+'</p></div>'}
function bind(){if(mode!=='admin')return;const newPassword=document.getElementById('newPassword');if(newPassword)newPassword.onsubmit=async e=>{e.preventDefault();const password=new FormData(newPassword).get('password');const r=await client.auth.updateUser({password});if(r.error){error=r.error.message;render()}else{recovery=false;error='';notice='Пароль успішно встановлено';await checkAdmin()}};const resetPassword=document.getElementById('resetPassword');if(resetPassword)resetPassword.onclick=async()=>{const email=document.querySelector('#login input[name=email]').value.trim();if(!email){error='Спочатку введіть email';render();return}const r=await client.auth.resetPasswordForEmail(email,{redirectTo:'https://donor-live-dashboard.vercel.app/?mode=admin'});error=r.error?.message||'';notice=r.error?'':'Якщо адреса зареєстрована, лист для відновлення пароля надіслано. Перевірте пошту.';render()};const login=document.getElementById('login');if(login)login.onsubmit=async e=>{e.preventDefault();const f=new FormData(login),r=await client.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(r.error){error=r.error.message;render()}else{error='';await checkAdmin()}};const logout=document.getElementById('logout');if(logout)logout.onclick=async()=>{await client.auth.signOut();await checkAdmin()};if(!isAdmin)return;document.getElementById('donorForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),r=await client.from('donor_entries').insert({school:f.get('school'),blood:f.get('blood'),ml:Number(f.get('ml'))});error=r.error?.message||'';await refresh()};document.getElementById('saveGoal').onclick=async()=>{const goal=Number(document.getElementById('goal').value);if(!Number.isInteger(goal)||goal<1)return;const r=await client.from('dashboard_settings').update({goal}).eq('id',1);error=r.error?.message||'';await refresh()};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Видалити запис?'))return;const r=await client.from('donor_entries').delete().eq('id',b.dataset.delete);error=r.error?.message||'';await refresh()})}
let realtimeChannel=null,reconnectAttempt=0,reconnectTimer=null;function scheduleReconnect(){if(reconnectTimer)return;const delay=Math.min(30000,1500*Math.pow(2,Math.min(reconnectAttempt++,5)));reconnectTimer=setTimeout(()=>{reconnectTimer=null;connectRealtime();refresh()},delay)}function connectRealtime(){if(realtimeChannel){client.removeChannel(realtimeChannel);realtimeChannel=null}realtimeChannel=client.channel('dashboard-changes').on('postgres_changes',{event:'*',schema:'public',table:'donor_entries'},payload=>{if(payload.eventType==='INSERT'&&payload.new&&payload.new.school)queueDonorCelebration(payload.new.school);refresh()}).on('postgres_changes',{event:'*',schema:'public',table:'dashboard_settings'},()=>refresh()).subscribe(status=>{if(status==='SUBSCRIBED'){reconnectAttempt=0;if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null}refresh()}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED')scheduleReconnect()})}window.addEventListener('online',()=>{connectRealtime();refresh()});document.addEventListener('visibilitychange',()=>{if(!document.hidden){connectRealtime();refresh()}});setInterval(()=>{if(!document.hidden)refresh()},60000);connectRealtime();
client.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recovery=true;mode='admin';render()}else if(!recovery){setTimeout(checkAdmin,0)}});refresh();checkAdmin();</script></body></html>
